services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: farmer_sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Password123"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
      - ./database/init.sql:/database/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Password123' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: farmer_sqlserver_init
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./database/init.sql:/database/init.sql:ro
    command: >
      /bin/bash -c "
      echo '[Docker Init]: Veritabani baslatildi, tablolar ve baslangic verileri yukleniyor...';
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P 'YourStrong!Password123' -C -i /database/init.sql;
      echo '[Docker Init]: Veritabani kurulumu basariyla tamamlandi.';
      "

volumes:
  mssql_data:

