name: ciftci_mobil
description: "Çiftçi İlan Platformu Mobil Uygulaması"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Network
  dio: ^5.4.3+1

  # Secure Storage (JWT)
  flutter_secure_storage: ^9.2.2

  # UI, Resim ve Formatlama
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

